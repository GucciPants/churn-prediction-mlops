name: Scheduled Retraining

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2:00 AM UTC
  workflow_dispatch:       # Manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train models
      run: |
        python src/train.py
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Check code formatting
      run: |
        pip install black
        black --check src/ api/ dashboard/ tests/
    
    - name: Build Docker images
      run: |
        docker build -t churn-prediction-api .
        docker build -f Dockerfile.dashboard -t churn-prediction-dashboard .
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: models/
        retention-days: 30
    
    - name: Notify success
      if: success()
      run: echo "✅ Model retraining completed successfully!"
    
    - name: Notify failure
      if: failure()
      run: echo "❌ Model retraining failed! Check logs for details."
